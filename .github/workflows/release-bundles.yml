name: Build and Release Bundles
on:
  push:
    tags:
      - 'registry@*'
      - 'bootstrap@*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify cosign installed
        run: cosign version

      - name: Extract tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build bundles
        run: node scripts/build_bundles.js --tag "${{ steps.tag.outputs.TAG_NAME }}" --outdir dist/bundles

      - name: Verify SHA256SUMS exists
        run: |
          test -f dist/bundles/SHA256SUMS.txt || { echo "ERROR: SHA256SUMS.txt not generated"; exit 1; }
          echo "SHA256SUMS.txt contents:"
          cat dist/bundles/SHA256SUMS.txt
          echo ""
          echo "Verifying checksums..."
          cd dist/bundles && sha256sum -c SHA256SUMS.txt
          echo "All checksums verified."

      - name: Sign each bundle asset (cosign keyless OIDC)
        run: |
          cd dist/bundles
          for file in role_registry.json tools_catalog.json policy_bundle.json context_bundle.json SHA256SUMS.txt; do
            echo "Signing ${file}..."
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.cert" \
              "${file}"
            echo "  -> ${file}.sig + ${file}.cert created"
          done
          echo ""
          echo "Signature files:"
          ls -la *.sig *.cert

      - name: Verify signatures (self-test)
        run: |
          cd dist/bundles
          for file in role_registry.json tools_catalog.json policy_bundle.json context_bundle.json SHA256SUMS.txt; do
            echo "Verifying ${file}..."
            cosign verify-blob "${file}" \
              --signature "${file}.sig" \
              --certificate "${file}.cert" \
              --certificate-identity-regexp "https://github.com/LucraLab/openclaw-control/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            echo "  PASS"
          done
          echo ""
          echo "All 5 assets verified."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Release $TAG" \
            --notes "Automated bundle release for tag \`$TAG\`.

          ## Bundle Contents
          - \`role_registry.json\` — Compiled roles and agent assignments
          - \`tools_catalog.json\` — Tool inventory with role mappings
          - \`policy_bundle.json\` — Capability rules and gating policies
          - \`context_bundle.json\` — Boot contract and platform metadata
          - \`SHA256SUMS.txt\` — Integrity checksums for all bundles

          ## Signatures
          Each bundle asset includes a \`.sig\` (signature) and \`.cert\` (certificate) file for cosign verification.

          ## Verification
          \`\`\`bash
          # Integrity check
          sha256sum -c SHA256SUMS.txt

          # Authenticity check (requires cosign)
          for f in role_registry.json tools_catalog.json policy_bundle.json context_bundle.json SHA256SUMS.txt; do
            cosign verify-blob \$f --signature \$f.sig --certificate \$f.cert \\
              --certificate-identity-regexp 'https://github.com/LucraLab/openclaw-control/.*' \\
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          done
          \`\`\`" \
            dist/bundles/role_registry.json \
            dist/bundles/tools_catalog.json \
            dist/bundles/policy_bundle.json \
            dist/bundles/context_bundle.json \
            dist/bundles/SHA256SUMS.txt \
            dist/bundles/*.sig \
            dist/bundles/*.cert

      - name: Summary
        run: |
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          echo "## Signed Bundle Release: ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Signature | Certificate |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-----------|-------------|" >> "$GITHUB_STEP_SUMMARY"
          for file in role_registry.json tools_catalog.json policy_bundle.json context_bundle.json SHA256SUMS.txt; do
            echo "| ${file} | ${file}.sig | ${file}.cert |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Bundle Assets" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|------|" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/bundles/*.json dist/bundles/SHA256SUMS.txt; do
            name=$(basename "$f")
            size=$(wc -c < "$f")
            echo "| ${name} | ${size} bytes |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Identity: \`https://github.com/LucraLab/openclaw-control/.github/workflows/release-bundles.yml\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Issuer: \`https://token.actions.githubusercontent.com\`" >> "$GITHUB_STEP_SUMMARY"
