name: Multiagent Wiring Stress v2
on:
  pull_request:

jobs:
  wiring-stress-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Wiring Stress v2 offline tests
        run: node tests/multiagent_wiring_stress_v2.test.js
        env:
          OPENCLAW_RUNTIME_DIR: ${{ runner.temp }}/oc-wiring-v2-test

      - name: Verify runner is MANUAL ONLY (not executed in CI)
        # The runner script must contain a CI environment guard that
        # exits nonzero when CI indicators (GITHUB_ACTIONS, GITLAB_CI,
        # CIRCLECI, JENKINS_URL) are detected. This gate verifies the
        # guard exists — it does NOT execute the runner.
        run: |
          if ! grep -q 'MANUAL ONLY' scripts/multiagent_wiring_stress_runner_v2.sh; then
            echo "FAIL: Runner must be marked MANUAL ONLY"
            exit 1
          fi
          if ! grep -q 'GITHUB_ACTIONS' scripts/multiagent_wiring_stress_runner_v2.sh; then
            echo "FAIL: Runner must check GITHUB_ACTIONS env var"
            exit 1
          fi
          echo "PASS: Runner is marked MANUAL ONLY with CI guard"

      - name: Verify no network imports in tests
        run: |
          if grep -qE 'require\(.*(http|https|net|dgram|dns|tls)\b' tests/multiagent_wiring_stress_v2.test.js; then
            echo "FAIL: Test file imports network modules"
            exit 1
          fi
          echo "PASS: No network modules imported in tests"

      - name: Verify no LLM SDK imports in tests
        run: |
          if grep -qE "require\(.*(openai|@anthropic|axios|node-fetch|got)\b" tests/multiagent_wiring_stress_v2.test.js; then
            echo "FAIL: LLM SDK or HTTP client import detected in tests"
            exit 1
          fi
          echo "PASS: No LLM SDK or HTTP client imports in tests"

      - name: Verify no secrets in source
        # No-Secrets Fixture Policy:
        # Test fixture token strings are sized ABOVE sanitization thresholds
        # (8-10 chars after prefix) but BELOW CI gate thresholds:
        #   sk-: 20+ alphanumeric → keep under 20
        #   ghp_: 20+ alphanumeric → keep under 20
        #   AKIA: 16 uppercase+digit → use mixed case or keep under 16
        # See docs/MULTIAGENT_STRESS_TEST_PACK.md for full rules.
        run: |
          if grep -qE "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{20,}|AKIA[A-Z0-9]{16})" tests/multiagent_wiring_stress_v2.test.js scripts/multiagent_wiring_stress_runner_v2.sh; then
            echo "FAIL: Possible secret found in source"
            exit 1
          fi
          echo "PASS: No secrets in source"

      - name: Verify fail-closed safety patterns in tests
        run: |
          node -e "
            const src = require('fs').readFileSync('tests/multiagent_wiring_stress_v2.test.js', 'utf8');
            const checks = [
              ['killSwitchGuard', 'Kill switch guard call'],
              ['quarantineList', 'Quarantine list check'],
              ['isQuarantined', 'Quarantine check function'],
              ['sanitize', 'Sanitization function'],
              ['shouldTriggerLLM', 'LLM gating function'],
              ['MANUAL ONLY', 'Manual-only verification'],
              ['GITHUB_ACTIONS', 'CI guard verification'],
              ['writeCanonicalArtifact', 'Artifact writer'],
            ];
            let ok = true;
            for (const [pattern, desc] of checks) {
              if (!src.includes(pattern)) {
                console.error('FAIL: Missing safety pattern:', desc, '(' + pattern + ')');
                ok = false;
              } else {
                console.log('PASS:', desc);
              }
            }
            if (!ok) process.exit(1);
          "

      - name: Verify minimum test count
        run: |
          PASS_COUNT=$(node tests/multiagent_wiring_stress_v2.test.js 2>&1 | grep -c "PASS:" || true)
          echo "Tests passing: $PASS_COUNT"
          if [ "$PASS_COUNT" -lt 30 ]; then
            echo "FAIL: Minimum 30 tests required, only $PASS_COUNT passing"
            exit 1
          fi
          echo "PASS: $PASS_COUNT tests passing (minimum 30)"
        env:
          OPENCLAW_RUNTIME_DIR: ${{ runner.temp }}/oc-wiring-v2-count

      - name: Verify runner token bounds
        run: |
          if ! grep -q 'MAX_TOKENS=64' scripts/multiagent_wiring_stress_runner_v2.sh; then
            echo "FAIL: Runner must have MAX_TOKENS=64"
            exit 1
          fi
          if ! grep -q 'TEMPERATURE=0' scripts/multiagent_wiring_stress_runner_v2.sh; then
            echo "FAIL: Runner must have TEMPERATURE=0"
            exit 1
          fi
          if ! grep -q 'MAX_CONCURRENCY=3' scripts/multiagent_wiring_stress_runner_v2.sh; then
            echo "FAIL: Runner must have MAX_CONCURRENCY=3"
            exit 1
          fi
          if ! grep -q 'killswitch' scripts/multiagent_wiring_stress_runner_v2.sh; then
            echo "FAIL: Runner must check killswitch"
            exit 1
          fi
          echo "PASS: Runner has bounded token burn and safety checks"
