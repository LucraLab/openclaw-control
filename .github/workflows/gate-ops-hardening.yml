name: Ops Hardening
on:
  pull_request:

jobs:
  ops-hardening:
    name: ops-hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ops hardening tests
        run: node scripts/ops_hardening.test.js

      - name: Run ops hardening gate
        run: node scripts/run_ops_hardening_gate.js --ci

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-hardening-report
          path: |
            tmp/ops-hardening-report.json
            tmp/ops-hardening-report.md
            artifacts/ops-hardening-report.json
            artifacts/ops-hardening-report.md
          retention-days: 30
