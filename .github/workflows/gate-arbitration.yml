name: Arbitration

on:
  pull_request:

jobs:
  arbitration:
    name: arbitration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run arbitration tests
        run: node scripts/arbitration.test.js

      - name: Run arbitration gate
        run: node scripts/run_arbitration_gate.js --ci

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbitration-report
          path: |
            tmp/arbitration-report.json
            tmp/arbitration-report.md
          retention-days: 30
