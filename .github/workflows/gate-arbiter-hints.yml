name: Arbiter Hints
on:
  pull_request:

jobs:
  arbiter-hints:
    name: arbiter-hints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run arbiter hints tests
        run: node scripts/arbiter_hints.test.js

      - name: Run arbiter hints gate
        run: node scripts/run_arbiter_hints_gate.js --ci

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-hints-report
          path: |
            tmp/arbiter-hints-report.json
            tmp/arbiter-hints-report.md
            artifacts/arbiter-hints-report.json
            artifacts/arbiter-hints-report.md
          retention-days: 30
