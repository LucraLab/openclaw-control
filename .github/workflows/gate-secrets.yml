name: Secret Scan
on:
  pull_request:

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secret patterns in changed files
        run: |
          FOUND=0

          # Get list of changed files
          FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || find . -type f -not -path './.git/*')

          for file in $FILES; do
            if [ -f "$file" ]; then
              # Check for common API key patterns
              if grep -qEi '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16}|xoxb-[0-9]+-[a-zA-Z0-9]+)' "$file" 2>/dev/null; then
                echo "FAIL: Potential secret pattern found in $file"
                FOUND=1
              fi

              # Check for password/token assignments with actual values
              if grep -qEi '(PASSWORD|SECRET|TOKEN|API_KEY|PRIVATE_KEY)=[^$\{REDACTED][^\n]{8,}' "$file" 2>/dev/null; then
                echo "WARN: Potential credential assignment in $file"
                FOUND=1
              fi
            fi
          done

          # Check for forbidden file types in changeset
          FORBIDDEN=$(echo "$FILES" | grep -iE '\.(env|pem|key)$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "FAIL: Forbidden file type in changeset:"
            echo "$FORBIDDEN"
            FOUND=1
          fi

          # Check for credential directory additions
          CRED_DIRS=$(echo "$FILES" | grep -iE '(credentials|secrets)/' || true)
          if [ -n "$CRED_DIRS" ]; then
            echo "FAIL: Files in credentials/secrets directory:"
            echo "$CRED_DIRS"
            FOUND=1
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "PASS: No secret patterns detected"
          fi

          exit $FOUND
