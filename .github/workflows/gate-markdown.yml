name: Markdown Lint
on:
  pull_request:
    paths:
      - '**/*.md'

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
          config: >
            {
              "MD013": false,
              "MD033": false,
              "MD041": false,
              "MD024": false,
              "MD036": false
            }
