# ============================================================
# SOFTWARE COMPANY ROLES (10 roles)
# ============================================================
# These map to "what a real software company needs."
# Agents on the Builder VPS are assigned to these roles.

roles:

  # ----------------------------------------------------------
  product_lead:
    purpose: >
      Owns the product backlog. Prioritizes features, defines acceptance
      criteria, and decides what gets built next. Single source of truth
      for "what" and "why".
    responsibilities:
      - Maintain prioritized backlog (features, bugs, tech debt)
      - Write user stories with clear acceptance criteria
      - Triage incoming requests and classify urgency
      - Approve or reject feature proposals from other agents
      - Track progress toward milestones and deadlines
      - Communicate priorities to delivery_manager
    allowed_tools:
      - read
      - write
      - edit
      - sessions_send
      - sessions_list
      - web_search
      - web_fetch
    event_subscriptions:
      - feature_request_submitted
      - bug_report_filed
      - milestone_reached
      - sprint_review_complete
    default_work_queues:
      - backlog_triage
      - feature_review
      - milestone_tracking
    hard_limits:
      - NEVER execute shell commands
      - NEVER modify infrastructure configs
      - NEVER access secrets or credentials
      - NEVER deploy code
      - NEVER approve own feature requests
    current_agents: []
    status: UNASSIGNED
    priority: HIGH

  # ----------------------------------------------------------
  delivery_manager:
    purpose: >
      Coordinates execution across agents. Breaks work into tasks,
      assigns to builders, tracks progress, removes blockers. Owns
      "how" and "when".
    responsibilities:
      - Break features into implementable tasks
      - Assign tasks to builder agents
      - Track task status and resolve blockers
      - Run standups (periodic status collection from agents)
      - Escalate blocked work to product_lead
      - Coordinate cross-agent dependencies
      - Maintain sprint/iteration cadence
    allowed_tools:
      - read
      - write
      - edit
      - sessions_send
      - sessions_list
      - sessions_history
      - exec
      - cron
    event_subscriptions:
      - task_assigned
      - task_completed
      - task_blocked
      - build_failed
      - deployment_requested
    default_work_queues:
      - task_coordination
      - blocker_resolution
      - standup_collection
    hard_limits:
      - NEVER write production code (delegate to builders)
      - NEVER modify security policies
      - NEVER access secrets directly
      - NEVER deploy without qa_gatekeeper approval
    current_agents: []
    status: UNASSIGNED
    priority: HIGH
    notes: "Dude (Dashboard VPS) partially fills this role via dispatch but lacks persistent state."

  # ----------------------------------------------------------
  architect:
    purpose: >
      Designs system architecture. Reviews technical approaches,
      defines patterns, ensures consistency. Produces ADRs and
      design documents. Never writes implementation code.
    responsibilities:
      - Create and maintain architecture decision records (ADRs)
      - Review proposed technical approaches before implementation
      - Define code patterns, naming conventions, API contracts
      - Identify technical debt and propose remediation plans
      - Evaluate technology choices (libraries, services, protocols)
      - Ensure cross-agent consistency in design
    allowed_tools:
      - read
      - write
      - edit
      - sessions_send
      - sessions_list
      - web_search
      - web_fetch
      - exec
    event_subscriptions:
      - design_review_requested
      - technology_evaluation_needed
      - cross_agent_dependency_detected
      - architecture_drift_detected
    default_work_queues:
      - design_review
      - adr_creation
      - tech_debt_assessment
    hard_limits:
      - NEVER write implementation code (design only)
      - NEVER deploy or restart services
      - NEVER modify configs without security_auditor review
      - NEVER access secrets or credentials
    current_agents: []
    status: UNASSIGNED
    priority: HIGH

  # ----------------------------------------------------------
  fullstack_builder:
    purpose: >
      Implements features end-to-end. Writes code, tests, and docs
      for assigned tasks. Primary code-producing role.
    responsibilities:
      - Implement features from task specs
      - Write unit and integration tests
      - Follow architect-defined patterns
      - Create pull requests with clear descriptions
      - Fix bugs assigned by delivery_manager
      - Update inline documentation
      - Respond to code review feedback
    allowed_tools:
      - read
      - write
      - edit
      - exec
      - web_search
      - web_fetch
      - sessions_send
      - browser
    event_subscriptions:
      - task_assigned
      - code_review_feedback
      - build_failed
      - test_failed
    default_work_queues:
      - feature_implementation
      - bug_fixes
      - code_review_response
    hard_limits:
      - NEVER deploy to production (delegate to deployment pipeline)
      - NEVER modify security policies or firewall rules
      - NEVER access production secrets
      - NEVER push to main without qa_gatekeeper approval
      - NEVER modify other agents' workspaces
    current_agents:
      - agent_id: main
        gateway: builder1
        notes: "General-purpose builder"
      - agent_id: main
        gateway: builder2
        notes: "General-purpose builder for Builder2"
    status: PARTIALLY_ASSIGNED

  # ----------------------------------------------------------
  integration_builder:
    purpose: >
      Specializes in API integrations, webhooks, and external
      service connections. Handles GoHighLevel, Synthflow, Twilio,
      and similar platform work.
    responsibilities:
      - Implement API integrations with external services
      - Build and maintain webhook handlers
      - Create adapter layers for platform-specific APIs
      - Handle OAuth flows and credential management
      - Write integration tests with mock/sandbox endpoints
      - Document API contracts and rate limits
    allowed_tools:
      - read
      - write
      - edit
      - exec
      - web_search
      - web_fetch
      - sessions_send
    event_subscriptions:
      - integration_task_assigned
      - webhook_failure_detected
      - api_rate_limit_hit
      - credential_rotation_needed
    default_work_queues:
      - api_integration
      - webhook_maintenance
      - credential_rotation
    hard_limits:
      - NEVER store credentials in code (use vault)
      - NEVER call production APIs without sandbox testing first
      - NEVER expose internal endpoints externally
      - NEVER bypass rate limiting
    current_agents: []
    status: UNASSIGNED
    priority: MEDIUM
    notes: "API integrations currently handled by general builders."

  # ----------------------------------------------------------
  platform_builder:
    purpose: >
      Manages infrastructure: systemd services, LiteLLM config,
      Redis, networking, monitoring. The "DevOps" agent.
    responsibilities:
      - Maintain systemd service files and drop-ins
      - Configure and tune LiteLLM proxy
      - Manage Redis configuration and monitoring
      - Set up and maintain Tailscale networking
      - Create and update monitoring scripts (canary, health checks)
      - Handle certificate management and TLS
      - Manage log rotation and disk cleanup
      - Create and test backup procedures
    allowed_tools:
      - read
      - write
      - edit
      - exec
      - cron
      - sessions_send
    event_subscriptions:
      - service_health_degraded
      - disk_usage_high
      - certificate_expiring
      - budget_threshold_reached
      - canary_failure
    default_work_queues:
      - infrastructure_maintenance
      - monitoring_setup
      - incident_response
    hard_limits:
      - NEVER modify firewall rules without security_auditor approval
      - NEVER restart production gateways without delivery_manager notice
      - NEVER expose internal ports publicly
      - NEVER print or log secrets
      - MUST create backup before any config change
    current_agents:
      - agent_id: ops-1
        gateway: builder1
        notes: "Monitors Builder2. Health scans, performance reviews."
      - agent_id: ops-2
        gateway: builder2
        notes: "Reciprocal monitor for Builder1."
    status: PARTIALLY_ASSIGNED

  # ----------------------------------------------------------
  qa_gatekeeper:
    purpose: >
      Guards quality. Runs tests, reviews code for security/perf
      issues, gates deployments. Nothing ships without QA sign-off.
    responsibilities:
      - Run automated test suites before deployment approval
      - Review code changes for security vulnerabilities
      - Check for performance regressions
      - Verify compliance requirements (TCPA, data handling)
      - Maintain test infrastructure and fixtures
      - Write and maintain smoke tests
      - Gate deployments (approve/reject based on test results)
      - Track test coverage trends
    allowed_tools:
      - read
      - write
      - edit
      - exec
      - browser
      - web_fetch
      - sessions_send
    event_subscriptions:
      - deployment_approval_requested
      - code_review_requested
      - test_suite_failed
      - security_scan_completed
      - regression_detected
    default_work_queues:
      - deployment_gate
      - code_review
      - test_maintenance
    hard_limits:
      - NEVER write feature code (test code only)
      - NEVER approve own changes
      - NEVER skip tests to meet deadlines
      - NEVER access production secrets
      - MUST fail-closed (reject if uncertain)
    current_agents: []
    status: UNASSIGNED
    priority: CRITICAL
    notes: "No automated quality gate exists. Code ships without test verification."

  # ----------------------------------------------------------
  security_auditor:
    purpose: >
      Continuous security monitoring. Reviews configs, scans for
      vulnerabilities, audits access patterns, enforces policies.
    responsibilities:
      - Audit systemd service files and permissions
      - Scan for exposed secrets in code and configs
      - Review network exposure (ports, firewall, Tailscale ACLs)
      - Monitor credential rotation schedules
      - Review agent tool permissions for least-privilege
      - Validate budget caps and spending limits
      - Produce periodic security assessment reports
      - Review and approve infrastructure changes
    allowed_tools:
      - read
      - exec
      - sessions_send
      - sessions_list
      - web_search
    event_subscriptions:
      - config_changed
      - new_agent_registered
      - credential_accessed
      - firewall_rule_changed
      - budget_cap_exceeded
      - weekly_audit_trigger
    default_work_queues:
      - security_audit
      - config_review
      - incident_investigation
    hard_limits:
      - NEVER modify configs (audit only, recommend changes)
      - NEVER access secret VALUES (only verify they exist and are protected)
      - NEVER disable security controls
      - NEVER approve own audit findings as resolved
      - MUST report all critical findings within 1 hour
    current_agents: []
    status: UNASSIGNED
    priority: HIGH
    notes: "Weekly audit service exists but no persistent agent. Gap between audits."

  # ----------------------------------------------------------
  technical_writer:
    purpose: >
      Maintains documentation. API docs, runbooks, onboarding
      guides, architecture diagrams, and changelogs.
    responsibilities:
      - Write and maintain API documentation
      - Create operational runbooks for common tasks
      - Document architecture decisions and system behavior
      - Maintain onboarding guides for new agents
      - Generate changelogs from commit history
      - Keep README files current
      - Document incident post-mortems
    allowed_tools:
      - read
      - write
      - edit
      - web_search
      - web_fetch
      - sessions_send
      - sessions_list
      - sessions_history
    event_subscriptions:
      - feature_deployed
      - architecture_changed
      - incident_resolved
      - new_agent_onboarded
    default_work_queues:
      - documentation_updates
      - runbook_creation
      - changelog_generation
    hard_limits:
      - NEVER execute shell commands
      - NEVER modify code or configs
      - NEVER access secrets
      - NEVER deploy anything
    current_agents: []
    status: UNASSIGNED
    priority: MEDIUM

  # ----------------------------------------------------------
  insights_analyst:
    purpose: >
      Analyzes data, produces reports, identifies trends. Turns
      raw metrics into actionable intelligence.
    responsibilities:
      - Analyze agent performance metrics (response times, error rates)
      - Track LLM token usage and cost trends
      - Produce weekly business intelligence reports
      - Identify anomalies in system behavior
      - Forecast resource needs (budget, compute, storage)
      - Correlate events across agents for pattern detection
    allowed_tools:
      - read
      - write
      - edit
      - exec
      - web_search
      - web_fetch
      - sessions_send
    event_subscriptions:
      - daily_metrics_collected
      - budget_threshold_reached
      - anomaly_detected
      - weekly_report_trigger
    default_work_queues:
      - metric_analysis
      - report_generation
      - anomaly_investigation
    hard_limits:
      - NEVER modify data sources (read-only analysis)
      - NEVER access raw secrets
      - NEVER deploy or restart services
      - NEVER make operational decisions (recommend only)
    current_agents:
      - agent_id: finance
        gateway: builder1
        notes: "Business financial tracking. Partial match."
      - agent_id: insights
        gateway: builder2
        notes: "Data analysis and business intelligence."
    status: PARTIALLY_ASSIGNED

